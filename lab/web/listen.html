<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroFreak listening room</title>
<style>
  :root {
    --bg: #f3f1ec; --card: #fffdf9; --ink: #1d1b18; --soft: #6b665e; --line: #dedad1;
    --accent: #d9541e; --accent-soft: #f6d9cb; --chip: #ebe7de; --ghost: #c9c3b6;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412; --card: #1f1d1a; --ink: #ece8e0; --soft: #9d968a; --line: #34312c;
      --accent: #ff7a45; --accent-soft: #4a2a1c; --chip: #2b2925; --ghost: #57524a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header.top { max-width: 980px; margin: 0 auto; padding: 28px 16px 8px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .lede { margin: 6px 0 0; color: var(--soft); max-width: 62ch; }
  .bar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    max-width: 980px; margin: 0 auto; padding: 14px 16px 6px;
  }
  .bar input[type=search] {
    flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit;
  }
  .bar label { color: var(--soft); font-size: 14px; display: flex; gap: 6px; align-items: center; }
  .status { color: var(--soft); font-size: 13px; margin-left: auto; }
  main { max-width: 980px; margin: 0 auto; padding: 8px 16px 60px; display: grid; gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px;
    scroll-margin-top: 12px;
  }
  .card.target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .card.fresh .name::after {
    content: "new"; margin-left: 10px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--accent); vertical-align: middle;
  }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .name { margin: 0; font-size: 20px; font-family: var(--mono); font-weight: 600; word-break: break-word; }
  .name a { color: inherit; text-decoration: none; }
  .meta { color: var(--soft); font-size: 14px; }
  .about { margin: 8px 0 0; font-size: 16px; }
  .players { display: grid; gap: 10px; margin-top: 14px; }
  .player { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: center; }
  .player .what { font-size: 14px; }
  .player .what small { display: block; color: var(--soft); font-size: 12px; }
  audio { width: 100%; height: 38px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; margin-top: 16px; }
  h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-weight: 600; }
  ul.panel { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  ul.panel li { padding: 5px 0; border-top: 1px solid var(--line); white-space: pre-wrap; }
  ul.panel li:first-child { border-top: 0; }
  ul.panel b { font-weight: 600; }
  ul.panel .mod b { color: var(--accent); }
  svg.harm { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--soft); margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .numbers { font-size: 13px; color: var(--soft); margin: 8px 0 0; }
  details { margin-top: 12px; font-size: 13px; color: var(--soft); }
  details.part { margin-top: 0; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink); }
  details.part:first-of-type { border-top: 0; }
  details.part summary { cursor: pointer; color: var(--soft); }
  details.part summary b { color: var(--ink); font-family: var(--mono); }
  details.part ul.panel { margin: 6px 0 4px 14px; font-size: 13px; }
  .card.piece .name { font-family: inherit; font-size: 24px; letter-spacing: -0.01em; }
  details code { font-family: var(--mono); font-size: 12px; word-break: break-word; color: var(--ink); }
  .plain { color: var(--soft); font-size: 14px; margin-top: 12px; }
  .empty { text-align: center; color: var(--soft); padding: 60px 10px; }
  @media (max-width: 720px) {
    .cols { grid-template-columns: 1fr; }
    .player { grid-template-columns: 1fr; gap: 4px; }
    .status { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>MicroFreak <span>listening room</span></h1>
  <p class="lede">Every sound rendered on the emulated MicroFreak, newest first, with the settings to dial in on
    the real one. New renders appear here by themselves.</p>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Filter by name, word or setting" autocomplete="off">
  <label><input id="loop" type="checkbox"> Loop playback</label>
  <span class="status" id="status">Loading…</span>
</div>
<main id="list"></main>

<script>
const list = document.getElementById("list");
const statusEl = document.getElementById("status");
const q = document.getElementById("q");
const loopBox = document.getElementById("loop");
const cards = new Map();     // key (name:mtime) -> element
let firstLoad = true;
let seen = new Set();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function ago(mtime) {
  const s = Math.max(0, Date.now() / 1000 - mtime);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(mtime * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " +
         new Date(mtime * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function player(name, file, title, sub, mtime) {
  const row = el("div", "player");
  const what = el("div", "what", title);
  what.appendChild(el("small", "", sub));
  const a = document.createElement("audio");
  a.controls = true;
  a.preload = "none";
  a.loop = loopBox.checked;
  a.src = "/audio/" + encodeURIComponent(file) + ".wav?t=" + mtime;
  a.addEventListener("play", () => {
    document.querySelectorAll("audio").forEach(o => { if (o !== a) o.pause(); });
  });
  row.append(what, a);
  return row;
}

const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Bars for harmonics 1-16: how loud each sine wave is, in dB under the strongest. Floor at -60.
function harmonics(out, osc) {
  const W = 340, H = 150, L = 30, B = 22, T = 8, n = 16, FLOOR = -60;
  const g = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "harm", role: "img",
    "aria-label": "Level of harmonics 1 to 16" });
  const plotH = H - B - T, step = (W - L - 4) / n;
  for (const db of [0, -20, -40, -60]) {
    const y = T + plotH * (db / FLOOR);
    g.appendChild(svg("line", { x1: L, x2: W, y1: y, y2: y, stroke: "var(--line)", "stroke-width": 1 }));
    const t = svg("text", { x: L - 5, y: y + 4, "text-anchor": "end", "font-size": 10, fill: "var(--soft)" });
    t.textContent = db;
    g.appendChild(t);
  }
  for (let i = 0; i < n; i++) {
    const x = L + i * step;
    const h = db => plotH * Math.max(0, 1 - Math.max(db, FLOOR) / FLOOR);
    if (osc && osc[i] !== undefined) {
      const hh = h(osc[i]);
      g.appendChild(svg("rect", { x: x + 1.5, y: T + plotH - hh, width: step - 3, height: hh, rx: 2, fill: "var(--ghost)" }));
    }
    if (out && out[i] !== undefined) {
      const hh = h(out[i]);
      g.appendChild(svg("rect", { x: x + step * 0.28, y: T + plotH - hh, width: step * 0.44, height: hh, rx: 1.5, fill: "var(--accent)" }));
    }
    if (i === 0 || (i + 1) % 2 === 0) {
      const t = svg("text", { x: x + step / 2, y: H - 7, "text-anchor": "middle", "font-size": 10, fill: "var(--soft)" });
      t.textContent = i + 1;
      g.appendChild(t);
    }
  }
  return g;
}

function panelList(lines) {
  const ul = el("ul", "panel");
  for (const line of lines) {
    const li = el("li");
    const cut = line.indexOf(":");
    if (cut > 0 && cut < 40) {
      li.appendChild(el("b", "", line.slice(0, cut + 1)));
      li.appendChild(document.createTextNode(line.slice(cut + 1)));
    } else {
      li.textContent = line;
    }
    if (/^(Matrix|LFO|Assign\d|Utility)/.test(line)) li.classList.add("mod");
    ul.appendChild(li);
  }
  return ul;
}

function build(r) {
  const c = r.card;
  const card = el("article", "card");
  card.id = r.name;
  card.dataset.search = (r.name + " " + (c ? [c.about, c.asked, (c.panel || []).join(" "),
    ((c.output || {}).words || []).join(" ")].join(" ") : "")).toLowerCase();

  const piece = c && c.kind === "piece";
  if (piece) {
    card.classList.add("piece");
    card.dataset.search += " " + [c.title, (c.structure || []).join(" "),
      (c.tracks || []).map(t => t.name + " " + t.role + " " + (t.panel || []).join(" ")).join(" ")].join(" ").toLowerCase();
  }
  const head = el("div", "head");
  const h = el("h2", "name");
  const link = el("a", "", piece ? c.title : r.name);
  link.href = "#" + r.name;
  h.appendChild(link);
  const meta = el("span", "meta");
  meta.dataset.mtime = r.mtime;
  const length = r.seconds >= 60 ? Math.floor(r.seconds / 60) + " min " + Math.round(r.seconds % 60) + " s" : r.seconds.toFixed(1) + " s";
  meta.dataset.fixed = (piece ? "a piece in " + c.tracks.length + " parts · " :
    c ? "note " + c.note + " (" + c.note_hz + " Hz) · " : "") + length + " · ";
  meta.textContent = meta.dataset.fixed + ago(r.mtime);
  head.append(h, meta);
  card.appendChild(head);
  if (c && c.about) card.appendChild(el("p", "about", c.about));

  const players = el("div", "players");
  players.appendChild(piece ? player(r.name, r.name, "The piece", "all parts mixed, stereo", r.mtime)
                            : player(r.name, r.name, "Full sound", "through the filter and amp", r.mtime));
  if (r.oscillator_file) {
    players.appendChild(player(r.name, r.name + ".osc", "Oscillator only", "before the filter, exact", r.mtime));
  }
  card.appendChild(players);

  if (!c) {
    card.appendChild(el("p", "plain", "No settings were saved with this render (it was made before this page existed)."));
    return card;
  }
  if (piece) {
    const cols = el("div", "cols");
    const left = el("div");
    left.appendChild(el("h3", "", "How it is built"));
    const ul = el("ul", "panel");
    for (const line of c.structure || []) ul.appendChild(el("li", "", line));
    left.appendChild(ul);
    const right = el("div");
    right.appendChild(el("h3", "", "The parts and their settings"));
    for (const t of c.tracks || []) {
      const d = el("details", "part");
      const sum = el("summary");
      sum.appendChild(el("b", "", t.name));
      sum.appendChild(document.createTextNode(" · " + t.role + " · " + t.notes + " notes"));
      d.appendChild(sum);
      d.appendChild(panelList(t.panel || []));
      right.appendChild(d);
    }
    cols.append(left, right);
    card.appendChild(cols);
    if (c.mix) card.appendChild(el("p", "plain", c.mix));
    return card;
  }
  const words = (c.output && c.output.words) || [];
  if (words.length) {
    const chips = el("div", "chips");
    for (const w of words) chips.appendChild(el("span", "chip", w));
    card.appendChild(chips);
  }
  const cols = el("div", "cols");
  const left = el("div");
  left.appendChild(el("h3", "", "On the panel"));
  left.appendChild(panelList(c.panel || []));
  const right = el("div");
  right.appendChild(el("h3", "", "Sine waves in it (harmonics, dB)"));
  right.appendChild(harmonics((c.output || {}).harmonics_db, (c.oscillator || {}).harmonics_db));
  const legend = el("div", "legend");
  const a = el("span"); a.innerHTML = '<i style="background:var(--accent)"></i>'; a.append("full sound");
  const b = el("span"); b.innerHTML = '<i style="background:var(--ghost)"></i>'; b.append("oscillator only");
  legend.append(a, b);
  right.appendChild(legend);
  const o = c.output || {};
  if (o.centroid_hz !== undefined && o.centroid_hz !== null) {
    right.appendChild(el("p", "numbers", "Brightness centre " + Math.round(o.centroid_hz) + " Hz (harmonic " +
      o.centroid_harm + ")" + (typeof o.harmonic_share === "number" ? ", " + Math.round(o.harmonic_share * 100) +
      "% of the energy on the note's harmonics." : ".")));
  }
  cols.append(left, right);
  card.appendChild(cols);
  if (c.asked) {
    const d = el("details");
    d.appendChild(el("summary", "", "How it was made"));
    const p = el("p");
    p.appendChild(el("code", "", "lab/freak play " + c.asked + " --note " + c.note + " --name " + c.name));
    d.appendChild(p);
    d.appendChild(el("p", "", "The oscillator is the real firmware's output. The filter is a model of the analog one, so treat cutoff and resonance as a starting point."));
    card.appendChild(d);
  }
  return card;
}

function applyFilter() {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  for (const card of list.querySelectorAll(".card")) {
    const hit = words.every(w => card.dataset.search.includes(w));
    card.hidden = !hit;
    if (hit) shown++;
  }
  return shown;
}

function markTarget() {
  const want = decodeURIComponent(location.hash.slice(1));
  for (const card of list.querySelectorAll(".card")) card.classList.toggle("target", card.id === want && want !== "");
  return want;
}

async function refresh() {
  let data;
  try {
    const res = await fetch("/api/renders", { cache: "no-store" });
    data = await res.json();
  } catch (e) {
    statusEl.textContent = "Lost contact with rack, retrying…";
    return;
  }
  const keep = new Set();
  let before = null;
  // walk backwards so each card can be put in front of the one after it
  for (let i = data.renders.length - 1; i >= 0; i--) {
    const r = data.renders[i];
    const key = r.name + ":" + r.mtime;
    keep.add(key);
    let card = cards.get(key);
    if (!card) {
      card = build(r);
      if (!firstLoad && !seen.has(key)) card.classList.add("fresh");
      cards.set(key, card);
    }
    seen.add(key);
    if (card.nextSibling !== before || card.parentNode !== list) list.insertBefore(card, before);
    before = card;
  }
  for (const [key, card] of cards) {
    if (!keep.has(key)) {
      const playing = [...card.querySelectorAll("audio")].some(a => !a.paused);
      if (playing) continue;   // let it finish; it goes on the next pass
      card.remove();
      cards.delete(key);
    }
  }
  for (const m of list.querySelectorAll(".meta")) m.textContent = m.dataset.fixed + ago(+m.dataset.mtime);
  let empty = document.getElementById("empty");
  if (!data.renders.length && !empty) {
    empty = el("p", "empty", "Nothing rendered yet. Ask Claude for a MicroFreak sound and it will appear here.");
    empty.id = "empty";
    list.appendChild(empty);
  } else if (data.renders.length && empty) {
    empty.remove();
  }
  const shown = applyFilter();
  statusEl.textContent = data.renders.length + (data.renders.length === 1 ? " render" : " renders") +
    (shown !== data.renders.length ? ", " + shown + " shown" : "") + " · checks every 4 s";
  const want = markTarget();
  if (firstLoad && want) {
    const t = document.getElementById(want);
    if (t) t.scrollIntoView({ block: "start" });
  }
  firstLoad = false;
}

q.addEventListener("input", applyFilter);
loopBox.addEventListener("change", () => document.querySelectorAll("audio").forEach(a => { a.loop = loopBox.checked; }));
window.addEventListener("hashchange", markTarget);
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
